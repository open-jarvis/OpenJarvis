name: Bash tests

on:
  pull_request:
    paths:
      - 'scripts/install/**'
      - 'tests/install/bash/**'
      - '.github/workflows/bash-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/install/**'
      - 'tests/install/bash/**'

# Least-privilege default: every job here only reads the repository.
# Without this block the workflow inherits the repository default, which
# may be read/write.
permissions:
  contents: read

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install bats-core
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run bats tests
        run: bats tests/install/bash/
