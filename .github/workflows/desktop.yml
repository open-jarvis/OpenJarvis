name: Desktop Build & Release

on:
  push:
    tags:
      - 'v*'
      - 'desktop-v*'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'rust/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.0.2.dev500). If set, autotag dispatches use this. github.ref still controls the checkout.'
        required: false
        type: string

concurrency:
  # All rolling builds publish to the same desktop-edge release. Serialize
  # them even when their v* tags (or dispatch inputs) differ.
  group: desktop-${{ (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/desktop-v')) && github.ref || 'edge' }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # Build an unsigned test installer on PRs; this job never publishes releases
  # or uses signing credentials. Exercise the existing x64 backend on ARM too.
  test-windows-arm64:
    if: github.event_name == 'pull_request'
    runs-on: windows-11-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Use the reviewed npm toolchain
        run: npm install --global npm@11.19.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            frontend/src-tauri -> target
            rust -> target

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Verify existing backend on Windows ARM64
        shell: bash
        env:
          UV_PYTHON: cpython-3.12-windows-x86_64-none
          CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
          RUSTUP_TOOLCHAIN: stable
          PYO3_CROSS_PYTHON_VERSION: '3.12'
          PYO3_CROSS_PYTHON_IMPLEMENTATION: CPython
        run: |
          uv sync --locked --extra dev --extra desktop --extra inference-cloud --extra inference-google --group desktop-native
          uv run python -c "import sysconfig, openjarvis_rust; assert sysconfig.get_platform() == 'win-amd64'; print('x64 backend and Rust extension import OK')"
          uv run jarvis --version
          uv run pytest tests/hardware/test_hardware_profiles.py tests/core/test_utils.py -q

      - name: Download ARM64 Ollama and stage test bundle
        shell: bash
        run: |
          frontend/src-tauri/scripts/download-ollama.sh aarch64-pc-windows-msvc
          node <<'NODE'
          const { writeFileSync } = require('node:fs');
          writeFileSync('frontend/src-tauri/tauri.arm64-test.conf.json', JSON.stringify({
            bundle: {
              targets: ['nsis'],
              externalBin: ['binaries/ollama'],
              resources: { 'binaries/ollama-runtime-aarch64-pc-windows-msvc/': './' },
            },
          }));
          NODE

      - name: Build ARM64 test installer
        working-directory: frontend
        run: npx tauri build --target aarch64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.arm64-test.conf.json

      - name: Verify native ARM64 executables
        shell: bash
        run: |
          node frontend/src-tauri/scripts/verify-arm64-pe.mjs \
            frontend/src-tauri/target/aarch64-pc-windows-msvc/release/openjarvis-desktop.exe \
            frontend/src-tauri/binaries/ollama-aarch64-pc-windows-msvc.exe \
            frontend/src-tauri/binaries/ollama-runtime-aarch64-pc-windows-msvc/lib/ollama/llama-server.exe
          frontend/src-tauri/binaries/ollama-aarch64-pc-windows-msvc.exe --version
          frontend/src-tauri/binaries/ollama-runtime-aarch64-pc-windows-msvc/lib/ollama/llama-server.exe --version

      - name: Upload ARM64 test installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-arm64-test-installer
          path: frontend/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/**/*.exe
          if-no-files-found: error

  validate:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libdbus-1-dev

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Use the reviewed npm toolchain
        run: npm install --global npm@11.19.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'frontend/src-tauri -> target'

      - name: Create frontend dist stub
        run: mkdir -p frontend/dist && echo '<html><body></body></html>' > frontend/dist/index.html

      # `cargo test` builds the crate (same coverage as the old `cargo check`)
      # and runs the unit tests, including the #331 uv-sync error-formatting
      # helpers. Static command, no untrusted input — no injection surface.
      - name: Cargo test
        working-directory: frontend/src-tauri
        run: cargo test

  # Remove stale artifacts from the desktop-edge rolling pre-release so that
  # only the current build's files are available for download. (The stable
  # `desktop-latest` channel the installed app polls is never cleaned here.)
  clean-release:
    needs: [validate]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Delete old assets from desktop-edge
        if: "!startsWith(github.ref, 'refs/tags/desktop-v')"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/desktop-edge-release.json"
          if ! status=$(curl -sSL -o "$response" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/desktop-edge"); then
            echo "::error::Could not list desktop-edge release assets"
            exit 1
          fi
          if [[ "$status" == 404 ]]; then
            echo "desktop-edge release does not exist yet"
            exit 0
          fi
          if [[ "$status" != 200 ]]; then
            echo "::error::Listing desktop-edge release assets returned HTTP $status"
            exit 1
          fi
          release_id=$(jq -er '.id' "$response")
          assets="$RUNNER_TEMP/desktop-edge-assets.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            --paginate --slurp > "$assets"
          jq -e 'type == "array" and all(.[]; type == "array")' "$assets" > /dev/null
          for id in $(jq -r '.[].[] | .id' "$assets"); do
            echo "Deleting asset $id"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"
          done

  build-and-release:
    needs: [validate, clean-release]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    outputs:
      tag: ${{ steps.release-info.outputs.tag }}
      tauri_version: ${{ steps.release-info.outputs.tauri_version }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: macos-14
            args: '--target universal-apple-darwin'
          - platform: windows-latest
            args: ''
            target: x86_64-pc-windows-msvc
            updater-platform: windows-x86_64
          - platform: windows-11-arm
            args: '--target aarch64-pc-windows-msvc --bundles nsis'
            target: aarch64-pc-windows-msvc
            updater-platform: windows-aarch64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags so the workflow_dispatch fallback in
          # "Determine release info" can derive the dev version from the
          # latest release tag (#526).
          fetch-depth: 0

      # Validate Apple credentials BEFORE the expensive work. Notarization is
      # the very last thing `tauri-action` does, so a bad credential or a
      # lapsed account agreement previously surfaced ~10 minutes in — after the
      # Rust toolchain, npm install, two Ollama sidecar downloads and a
      # universal cargo build — as a single opaque line:
      #
      #   failed to bundle project: failed codesign application: failed to
      #   notarize app: Error: HTTP status code: 403. ...
      #
      # `notarytool history` is a read-only call (it submits nothing) that
      # exercises the identical auth path, so every credential/account failure
      # mode reaches us here first, in seconds, with the specific cause named.
      # `xcrun` is preinstalled on macOS runners, hence placement before the
      # toolchain steps rather than next to "Configure Apple signing".
      - name: Preflight Apple notarization credentials
        if: matrix.platform == 'macos-14'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          A_ID: ${{ secrets.APPLE_ID }}
          A_PASS: ${{ secrets.APPLE_PASSWORD }}
          A_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -uo pipefail

          # Mirror the skip logic in "Configure Apple signing": without a
          # certificate the build is unsigned and never notarizes, so there is
          # nothing to preflight. Tag builds still hard-fail there.
          if [ -z "$CERT" ]; then
            echo "No Apple certificate configured; skipping notarization preflight."
            exit 0
          fi

          missing=""
          [ -z "$A_ID" ]   && missing="$missing APPLE_ID"
          [ -z "$A_PASS" ] && missing="$missing APPLE_PASSWORD"
          [ -z "$A_TEAM" ] && missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::APPLE_CERTIFICATE is set but notarization secrets are missing:$missing"
            echo "::error::Signing would succeed and notarization would then fail. Set them or clear APPLE_CERTIFICATE."
            exit 1
          fi

          # Retry only to absorb transient network faults. Credential and
          # account errors are deterministic, so we classify and exit on the
          # first definitive answer rather than retrying into the same wall.
          attempt=1
          while [ "$attempt" -le 3 ]; do
            out=$(xcrun notarytool history \
              --apple-id "$A_ID" \
              --team-id "$A_TEAM" \
              --password "$A_PASS" \
              --output-format json 2>&1)
            rc=$?

            if [ $rc -eq 0 ]; then
              echo "Apple notarization preflight OK — credentials valid, team reachable, agreements in effect."
              exit 0
            fi

            case "$out" in
              *"Invalid credentials"*|*"401"*)
                echo "::error::Apple notarization preflight failed: invalid credentials (HTTP 401)."
                echo "::error::APPLE_PASSWORD must be an app-specific password from appleid.apple.com,"
                echo "::error::generated while signed in as the SAME Apple ID as APPLE_ID. A regular"
                echo "::error::Apple ID password will not work, and a password minted under a different"
                echo "::error::Apple ID authenticates as that other account."
                exit 1
                ;;
              *"Invalid or inaccessible developer team ID"*)
                echo "::error::Apple notarization preflight failed: APPLE_ID is not a member of team APPLE_TEAM_ID (HTTP 403)."
                echo "::error::The Team ID must match the signing certificate. Read it from the cert's"
                echo "::error::subject, where it appears as: Developer ID Application: NAME (TEAMID)."
                echo "::error::If you belong to several teams, confirm APPLE_ID is a member of this one."
                exit 1
                ;;
              *"required agreement"*|*"agreement"*)
                echo "::error::Apple notarization preflight failed: the team has no in-effect agreement (HTTP 403)."
                echo "::error::Apple reissues the Developer Program License Agreement periodically and"
                echo "::error::notarization is refused until it is accepted. ONLY THE ACCOUNT HOLDER can"
                echo "::error::accept it — team Admins cannot. Sign in to the account that owns this team:"
                echo "::error::  1. https://developer.apple.com/account -> review any pending agreement"
                echo "::error::  2. App Store Connect -> Business -> accept anything pending there too"
                echo "::error::Certificates stay valid while this is outstanding, so signing still works."
                exit 1
                ;;
            esac

            echo "Preflight attempt ${attempt}/3 failed with a non-credential error."
            echo "$out" | tail -5
            attempt=$((attempt + 1))
            [ "$attempt" -le 3 ] && sleep 10
          done

          echo "::error::Apple notarization preflight failed after 3 attempts. Last output:"
          echo "$out" | tail -20
          exit 1

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libdbus-1-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-14' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'frontend/src-tauri -> target'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Use the reviewed npm toolchain
        run: npm install --global npm@11.19.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Download Ollama sidecar
        shell: bash
        env:
          OLLAMA_TARGET: ${{ matrix.target }}
        run: |
          cd frontend/src-tauri/scripts && chmod +x download-ollama.sh
          if [[ "${{ matrix.platform }}" == "macos-14" ]]; then
            # Tauri builds each architecture first, then bundles the universal
            # app. Ollama's darwin archive already contains both slices, so
            # download it once and supply all three names Tauri looks for.
            ./download-ollama.sh universal-apple-darwin
            BINARIES_DIR="../binaries"
            UNIVERSAL="$BINARIES_DIR/ollama-universal-apple-darwin"
            for arch in aarch64 x86_64; do
              cp "$UNIVERSAL" "$BINARIES_DIR/ollama-${arch}-apple-darwin"
            done
            for target in universal-apple-darwin aarch64-apple-darwin x86_64-apple-darwin; do
              binary="$BINARIES_DIR/ollama-$target"
              if [[ ! -s "$binary" || ! -x "$binary" ]] || ! lipo "$binary" -verify_arch arm64 x86_64; then
                echo "::error::Missing or invalid macOS Ollama sidecar: $binary"
                exit 1
              fi
            done
          else
            ./download-ollama.sh "$OLLAMA_TARGET"
          fi

      - name: Determine release info
        id: release-info
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/desktop-v* ]]; then
            # Explicit stable desktop release tag
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#desktop-v}"
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "name=Desktop ${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Auto-tagged rolling build from autotag.yml — use the same
            # version as the CLI/PyPI release so all surfaces stay in sync.
            # Rolling/dev builds go to the `desktop-edge` channel, NOT the
            # `desktop-latest` channel the installed app polls — so users on
            # stable are never auto-updated onto an unvetted dev build.
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            echo "tag=desktop-edge" >> "$GITHUB_OUTPUT"
            echo "name=Desktop (Edge Build)" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            # workflow_dispatch fallback (manual UI dispatch without --ref).
            # Derive a PEP 440 dev version aligned with autotag.yml so we
            # don't burn the X.Y.Z release-version namespace.
            # pyproject.toml no longer carries a static version (#526), so the
            # base comes from the latest plain release tag (vX.Y.Z), matching
            # autotag.yml. .dev/.rc/desktop-* tags are excluded.
            LATEST_RELEASE=$(git tag --list 'v[0-9]*' --merged HEAD \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            if [[ -z "$LATEST_RELEASE" ]]; then
              echo "::error::No release tag (vX.Y.Z) reachable from HEAD"
              exit 1
            fi
            BASE="${LATEST_RELEASE#v}"
            MAJOR=$(echo "$BASE" | cut -d. -f1)
            MINOR=$(echo "$BASE" | cut -d. -f2)
            PATCH=$(echo "$BASE" | cut -d. -f3 | sed -E 's/[^0-9].*$//')
            NEXT_PATCH=$((PATCH + 1))
            BUILD=$(git rev-list --count HEAD)
            VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}.dev${BUILD}"
            # Manual dispatches are also dev builds -> the edge channel.
            echo "tag=desktop-edge" >> "$GITHUB_OUTPUT"
            echo "name=Desktop (Edge Build)" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # Tauri requires SemVer; MSI also requires a single numeric prerelease
          # identifier no greater than 65535. Keep the PEP 440 tag for PyPI,
          # but bundle 1.0.5.dev1182 as 1.0.5-1182 on every desktop platform.
          if [[ "$VERSION" == *.dev* ]]; then
            if [[ ! "$VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\.dev([0-9]+)$ ]]; then
              echo "::error::Unsupported desktop dev version: $VERSION"
              exit 1
            fi
            BASE_VERSION="${BASH_REMATCH[1]}"
            DEV_NUMBER="${BASH_REMATCH[2]}"
            if (( ${#DEV_NUMBER} > 5 )); then
              echo "::error::Desktop dev number exceeds MSI's 65535 limit: $DEV_NUMBER"
              exit 1
            fi
            DEV_NUMBER=$((10#$DEV_NUMBER))
            if (( DEV_NUMBER > 65535 )); then
              echo "::error::Desktop dev number exceeds MSI's 65535 limit: $DEV_NUMBER"
              exit 1
            fi
            TAURI_VERSION="${BASE_VERSION}-${DEV_NUMBER}"
          else
            TAURI_VERSION="$VERSION"
          fi
          echo "tauri_version=${TAURI_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Write Tauri release config
        shell: bash
        env:
          TAURI_VERSION: ${{ steps.release-info.outputs.tauri_version }}
          OLLAMA_TARGET: ${{ matrix.target }}
        run: |
          # The CLI and tauri-action both read --config. An environment-only
          # TAURI_CONFIG override leaves the action's version at tauri.conf.json.
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { writeFileSync } = require('node:fs');
          assert.match(process.env.TAURI_VERSION,
            /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/,
            'Tauri release version must be SemVer');
          const config = {
            version: process.env.TAURI_VERSION,
            bundle: {
              createUpdaterArtifacts: true,
              externalBin: ['binaries/ollama'],
            },
          };
          if (process.env.OLLAMA_TARGET === 'aarch64-pc-windows-msvc') {
            config.bundle.resources = { 'binaries/ollama-runtime-aarch64-pc-windows-msvc/': './' };
          }
          writeFileSync('frontend/src-tauri/tauri.release.conf.json', JSON.stringify(config));
          NODE

      - name: Configure Apple signing
        if: runner.os == 'macOS'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGN_ID: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          A_ID: ${{ secrets.APPLE_ID }}
          A_PASS: ${{ secrets.APPLE_PASSWORD }}
          A_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          if [ -n "$CERT" ]; then
            echo "APPLE_CERTIFICATE=$CERT" >> "$GITHUB_ENV"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASS" >> "$GITHUB_ENV"
            echo "APPLE_SIGNING_IDENTITY=$SIGN_ID" >> "$GITHUB_ENV"
            echo "APPLE_ID=$A_ID" >> "$GITHUB_ENV"
            echo "APPLE_PASSWORD=$A_PASS" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$A_TEAM" >> "$GITHUB_ENV"
            echo "Apple signing configured"
          else
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              echo "::error::Apple signing secrets are required for release builds"
              exit 1
            fi
            echo "No Apple certificate configured, skipping code signing"
          fi

      - name: Build and release
        id: tauri-build
        timeout-minutes: 120
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # tauri-action runs beforeBuildCommand (npm run build:tauri -> vite
          # build), which requires this at build time (#587). Strict for
          # releases: a missing/empty secret fails the build by design.
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        with:
          projectPath: frontend
          tauriScript: npx tauri
          tagName: ${{ steps.release-info.outputs.tag }}
          releaseName: ${{ steps.release-info.outputs.name }}
          releaseBody: 'Desktop application built from ${{ github.sha }}'
          releaseDraft: false
          prerelease: ${{ steps.release-info.outputs.prerelease }}
          uploadUpdaterJson: true
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json

      - name: Verify release metadata and updater signature
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.release-info.outputs.tauri_version }}
          BUILT_VERSION: ${{ steps.tauri-build.outputs.appVersion }}
          ARTIFACT_PATHS: ${{ steps.tauri-build.outputs.artifactPaths }}
          EXPECTED_UPDATER_PLATFORM: ${{ matrix.updater-platform }}
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { existsSync, readFileSync, statSync } = require('node:fs');
          const { basename } = require('node:path');

          const expected = process.env.EXPECTED_VERSION;
          assert.equal(process.env.BUILT_VERSION, expected, 'tauri-action version');

          const artifacts = JSON.parse(process.env.ARTIFACT_PATHS);
          assert.ok(artifacts.some(path => basename(path).includes(expected)),
            `No versioned bundle for ${expected}`);
          assert.ok(artifacts.some(path => path.endsWith('.sig') && statSync(path).size > 0),
            'No updater signature artifact');

          assert.ok(existsSync('latest.json'), 'tauri-action did not generate latest.json');
          const latest = JSON.parse(readFileSync('latest.json', 'utf8'));
          assert.equal(latest.version, expected, 'latest.json version');
          const prefix = process.env.EXPECTED_UPDATER_PLATFORM ||
            { Linux: 'linux-', macOS: 'darwin-' }[process.env.RUNNER_OS];
          assert.ok(Object.entries(latest.platforms || {}).some(([platform, entry]) =>
            platform.startsWith(prefix) && entry.signature?.trim() && entry.url),
            `No signed ${process.env.RUNNER_OS} updater in latest.json`);
          NODE

      - name: Verify native ARM64 release executables
        if: matrix.platform == 'windows-11-arm'
        shell: bash
        run: |
          node frontend/src-tauri/scripts/verify-arm64-pe.mjs \
            frontend/src-tauri/target/aarch64-pc-windows-msvc/release/openjarvis-desktop.exe \
            frontend/src-tauri/binaries/ollama-aarch64-pc-windows-msvc.exe \
            frontend/src-tauri/binaries/ollama-runtime-aarch64-pc-windows-msvc/lib/ollama/llama-server.exe

  verify-release:
    needs: [build-and-release]
    runs-on: ubuntu-latest
    steps:
      - name: Verify published updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.build-and-release.outputs.tag }}
          EXPECTED_VERSION: ${{ needs.build-and-release.outputs.tauri_version }}
        run: |
          mkdir -p "$RUNNER_TEMP/desktop-release-check"
          for attempt in 1 2 3 4 5; do
            if gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern latest.json --dir "$RUNNER_TEMP/desktop-release-check" --clobber; then
              break
            fi
            echo "latest.json unavailable (attempt $attempt); retrying"
            sleep 3
          done
          test -s "$RUNNER_TEMP/desktop-release-check/latest.json"
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.id')
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            --paginate --slurp > "$RUNNER_TEMP/desktop-release-check/assets.json"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.sig' --dir "$RUNNER_TEMP/desktop-release-check" --clobber
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { readFileSync } = require('node:fs');
          const { basename, join } = require('node:path');
          const checkDir = join(process.env.RUNNER_TEMP, 'desktop-release-check');
          const latest = JSON.parse(readFileSync(join(checkDir, 'latest.json'), 'utf8'));
          const assets = JSON.parse(readFileSync(join(checkDir, 'assets.json'), 'utf8')).flat();
          const assetsByUrl = new Map(assets.map(asset => [asset.url, asset]));
          const assetsByName = new Map(assets.map(asset => [asset.name, asset]));
          assert.equal(latest.version, process.env.EXPECTED_VERSION);
          for (const platform of ['darwin-aarch64', 'darwin-x86_64', 'linux-x86_64', 'windows-x86_64', 'windows-aarch64']) {
            const entry = latest.platforms?.[platform];
            assert.ok(entry?.signature?.trim() && entry?.url, `Missing signed updater for ${platform}`);
            const asset = assetsByUrl.get(entry.url);
            assert.ok(asset, `Updater URL for ${platform} is not an asset in this release`);
            const filename = basename(decodeURIComponent(new URL(asset.browser_download_url).pathname));
            assert.equal(filename, asset.name, `Unexpected updater asset name for ${platform}`);
            assert.ok(filename.includes(process.env.EXPECTED_VERSION),
              `Updater asset for ${platform} has an old version: ${filename}`);
            const signatureName = `${asset.name}.sig`;
            assert.ok(assetsByName.has(signatureName), `Missing uploaded ${signatureName}`);
            assert.equal(readFileSync(join(checkDir, signatureName), 'utf8').trim(),
              entry.signature.trim(), `Signature mismatch for ${platform}`);
          }
          NODE

  # When a stable `desktop-v*` release is published, repoint the
  # `desktop-latest` auto-update channel (the endpoint the installed app
  # polls) at it. The stable release's own `latest.json` already references
  # this release's signed assets, so we copy it verbatim — installed apps are
  # only ever offered vetted stable builds, never `desktop-edge` dev builds.
  refresh-stable-channel:
    needs: [verify-release]
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    steps:
      - name: Mirror stable latest.json into desktop-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STABLE_TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The stable release's updater manifest may take a moment to become
          # downloadable after tauri-action publishes it; retry briefly.
          URL="https://github.com/${REPO}/releases/download/${STABLE_TAG}/latest.json"
          for attempt in 1 2 3 4 5; do
            if curl -fsSL -o latest.json "$URL"; then
              echo "Fetched ${STABLE_TAG}/latest.json on attempt ${attempt}"
              break
            fi
            echo "latest.json not ready yet (attempt ${attempt}); sleeping 15s"
            sleep 15
          done
          test -s latest.json || { echo "::error::Could not fetch ${URL}"; exit 1; }
          # Ensure the channel release exists (prerelease so it never usurps
          # the stable "Latest" badge), then replace its manifest in place.
          if ! gh release view desktop-latest --repo "$REPO" >/dev/null 2>&1; then
            gh release create desktop-latest --repo "$REPO" \
              --prerelease \
              --title "Desktop Auto-Update Channel" \
              --notes "Auto-update channel pointer for the desktop app. Mirrors the latest stable \`desktop-v*\` release; the in-app updater polls this \`latest.json\`. Download the app from the latest stable release, not here."
          fi
          gh release upload desktop-latest latest.json --repo "$REPO" --clobber
          echo "desktop-latest now mirrors ${STABLE_TAG}"
