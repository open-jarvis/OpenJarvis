name: Docker validation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/docker-validation.yml"
      - "deploy/docker/**"
      - "pyproject.toml"
      - "uv.lock"
      - "rust/**"
      - "frontend/**"
      - "src/**"
      - "scripts/install/**"
      - "configs/openjarvis/examples/**"
      - "deploy/windows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build the CPU image from tracked source
        env:
          IMAGE: openjarvis-validation:${{ github.sha }}
        run: |
          git archive --format=tar HEAD | docker build \
            --progress=plain --file deploy/docker/Dockerfile --tag "$IMAGE" -

      - name: Verify installed CLI, native extension, UI, and presets
        env:
          IMAGE: openjarvis-validation:${{ github.sha }}
        run: |
          docker run --rm --network none "$IMAGE" --version
          docker run --rm --network none --entrypoint python "$IMAGE" -c '
          import os
          from pathlib import Path
          from importlib.resources import files
          import openjarvis_rust
          from openjarvis.cli._presets import available_presets
          assert os.getuid() != 0, "runtime must use an unprivileged user"
          assert os.access(Path.home(), os.W_OK), "runtime home must be writable"
          assert files("openjarvis.server").joinpath("static/index.html").is_file()
          assert available_presets(), "starter presets must be bundled"
          print("Container runtime smoke checks passed")
          '

  build-gpu-images:
    # These builds need no GPU. Run them explicitly when changing the GPU
    # Python/runtime packaging; avoid pulling both large bases on every PR.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: nvidia
            dockerfile: deploy/docker/Dockerfile.gpu
          - variant: rocm
            dockerfile: deploy/docker/Dockerfile.gpu.rocm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build a GPU image from tracked source
        env:
          IMAGE: openjarvis-validation:${{ matrix.variant }}-${{ github.sha }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          git archive --format=tar HEAD | docker build \
            --progress=plain --file "$DOCKERFILE" --tag "$IMAGE" -
      - name: Verify the supported Python and installed runtime
        env:
          IMAGE: openjarvis-validation:${{ matrix.variant }}-${{ github.sha }}
        run: |
          docker run --rm --network none --env NVIDIA_DISABLE_REQUIRE=true "$IMAGE" --version
          docker run --rm --network none --entrypoint python "$IMAGE" -c '
          import os, sys
          from pathlib import Path
          import datasets, lxml.etree, openjarvis_rust
          assert (3, 11) <= sys.version_info[:2] < (3, 14)
          assert sys.prefix == "/opt/openjarvis/venv"
          assert os.getuid() != 0
          assert os.access(Path.home(), os.W_OK)
          print("GPU image Python/native runtime checks passed without GPU hardware")
          '
