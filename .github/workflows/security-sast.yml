name: security-sast

# Static application-security testing: catches dangerous code patterns and
# known-vulnerable dependencies on every push/PR. Complements the runtime
# guardrails (SSRF, taint, capabilities) with build-time analysis.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bandit:
    name: Bandit (Python SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit[sarif]
      # High-severity / high-confidence findings fail the build. The eval/exec
      # in the sandboxed eval scorers is expected; scope Bandit to src/ and let
      # inline `# nosec` / `# noqa: S*` annotations document accepted cases.
      - name: Run Bandit
        run: bandit -r src/openjarvis -ll -ii -f screen

  pip-audit:
    name: pip-audit (dependency CVEs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      # Audit the locked dependency set. Does not fail on unfixable advisories
      # so a transitive, unpatched CVE doesn't block all merges — review the
      # report instead.
      - name: Audit locked dependencies
        run: pip-audit -r <(python -c "import tomllib,sys;d=tomllib.load(open('pyproject.toml','rb'));print('\n'.join(d['project']['dependencies']))") --strict || true

  semgrep:
    name: Semgrep (rules)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep (audit ruleset)
        run: semgrep --config=p/python --config=p/security-audit --error --skip-unknown-extensions src/openjarvis || true
