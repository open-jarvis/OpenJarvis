name: security-sast

# Called by the core lint job's dependency. Audits cannot be skipped or
# turned into green checks by suppressing scanner failures.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bandit:
    name: Bandit (high severity and confidence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install "bandit==1.9.4"
      # Existing intentional shell execution is annotated at the call sites.
      # -lll -iii gates only HIGH severity and HIGH confidence findings.
      - name: Reject high/high findings
        run: bandit -r src/openjarvis -lll -iii -f screen

  python-advisories:
    name: Python locked dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Reject unaccepted advisories in every locked Python extra/platform
        run: >-
          python scripts/security/audit_dependencies.py python
          --lockfile uv.lock --output python-lock-audit.json
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-lock-audit
          path: python-lock-audit.json
          if-no-files-found: error

  rust-advisories:
    name: Rust advisories (${{ matrix.manifest }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - manifest: rust/Cargo.toml
            lockfile: rust/Cargo.lock
            artifact: backend
          - manifest: frontend/src-tauri/Cargo.toml
            lockfile: frontend/src-tauri/Cargo.lock
            artifact: desktop
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-deny-${{ runner.os }}-0.21.0
      - name: Install the reviewed audit tool
        shell: bash
        run: |
          if ! cargo deny --version 2>/dev/null | grep -qx 'cargo-deny 0.21.0'; then
            cargo install cargo-deny --version 0.21.0 --locked --force
          fi
      - name: Validate exact exception versions and expiration
        env:
          LOCKFILE: ${{ matrix.lockfile }}
        run: >-
          python scripts/security/audit_dependencies.py cargo-config
          --lockfile "$LOCKFILE" --output "$RUNNER_TEMP/deny.toml"
      - name: Reject vulnerabilities, unsoundness, yanked crates and unknown sources
        env:
          MANIFEST: ${{ matrix.manifest }}
        run: |
          cargo deny --manifest-path "$MANIFEST" --config "$RUNNER_TEMP/deny.toml" \
            --locked --format json check --audit-compatible-output advisories sources \
            > rust-advisories.json 2> rust-advisories-diagnostics.jsonl
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-advisories-${{ matrix.artifact }}
          path: |
            rust-advisories.json
            rust-advisories-diagnostics.jsonl
          if-no-files-found: error

  semgrep:
    name: Semgrep (rules)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.185.0@sha256:67518c174185a2043fdbed16c70631b79209499b3671178e7194379b48295a0d
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject new static security findings
        env:
          BASELINE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          # checkout uses a temporary HOME; trust only this ephemeral checkout
          # in the scanner container's actual Git configuration as well.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          args=()
          if [ -n "$BASELINE" ] && [ "$BASELINE" != 0000000000000000000000000000000000000000 ]; then
            git cat-file -e "$BASELINE^{commit}"
            args+=(--baseline-commit "$BASELINE")
          fi
          semgrep scan --config=p/python --config=p/security-audit --error --strict \
            --metrics=off --disable-version-check --skip-unknown-extensions \
            --json --output semgrep.json "${args[@]}" src/openjarvis scripts/security
      - name: Upload static security report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-security
          path: semgrep.json
          if-no-files-found: error
