# Local-only chat configuration for use after dependencies and the model have
# been downloaded. Keep this separate from an existing config to preserve it.

[engine]
default = "ollama"

[engine.ollama]
host = "http://127.0.0.1:11434"

[intelligence]
default_model = "qwen3.5:4b"

[agent]
default_agent = "simple"
context_from_memory = false

[tools]
enabled = ""

[learning]
enabled = false

[analytics]
enabled = false

[telemetry]
enabled = false

[traces]
enabled = false

[updates]
auto_update = false

[server]
host = "127.0.0.1"
port = 8000
