# Personal-safe baseline: local conversation only.
# Add a capability only after testing it in isolation and reviewing its data path.

[intelligence]
provider = "local"
preferred_engine = "ollama"
default_model = "qwen3:8b"

[agent]
default_agent = "orchestrator"
max_turns = 4
tools = "calculator,think"
context_from_memory = false

[speech]
# Voice input is deliberately pinned to the local Faster-Whisper backend.
# It never falls back to a cloud provider, even if cloud API keys happen to
# exist in the shell environment. The model is downloaded once by its vendor
# on first use; after that, microphone audio is transcribed on this machine.
backend = "faster-whisper"
model = "base"
language = "pt"
# CPU is deliberate: it keeps speech reliable in WSL without depending on a
# matching CUDA/cuBLAS runtime. The rest of OpenJarvis may still use the GPU.
device = "cpu"
# int8 keeps the local model's memory footprint modest on CPU.
compute_type = "int8"

[tools.mcp]
# MCP servers are third-party execution/data boundaries. Keep them disabled
# until each server and its permissions have been reviewed.
enabled = false

[security]
enabled = true
profile = "shared"
mode = "block"
scan_input = true
scan_output = true
secret_scanner = true
pii_scanner = true
enforce_tool_confirmation = true
ssrf_protection = true
rate_limit_enabled = true
# The Obsidian connector and file tools may only read this single vault root.
# Do not replace this with a broad home/OneDrive directory.
allowed_dirs = ["/mnt/c/Users/engle/OneDrive/Obsidian"]

[security.capabilities]
enabled = true
default_deny = true

[sandbox]
# Enable and configure a mount allowlist before enabling code or shell tools.
enabled = false

[analytics]
enabled = false
choice_recorded = true

[telemetry]
enabled = false

[traces]
enabled = false

[server]
host = "127.0.0.1"
port = 8000
