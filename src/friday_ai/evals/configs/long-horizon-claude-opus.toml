# Long-horizon eval: Claude Opus 4.6 (cloud)
# 4 benchmarks: GAIA, FRAMES, DeepPlanning, LifelongAgent KG

[meta]
name = "long-horizon-claude-opus"
description = "Long-horizon benchmarks on Claude Opus 4.6"

[defaults]
temperature = 0.6
max_tokens = 8192

[judge]
model = "gpt-5-mini-2025-08-07"
temperature = 0.0
max_tokens = 4096

[run]
max_workers = 4
output_dir = "results/long-horizon-claude-opus/"
seed = 42

[[models]]
name = "claude-opus-4-6"
engine = "cloud"

[[benchmarks]]
name = "gaia"
backend = "friday-agent"
agent = "monitor_operative"
max_samples = 50
tools = ["think", "calculator", "code_interpreter", "web_search", "file_read"]

[[benchmarks]]
name = "frames"
backend = "friday-direct"
max_samples = 50

[[benchmarks]]
name = "deepplanning"
backend = "friday-agent"
agent = "monitor_operative"
max_samples = 50
tools = ["think", "calculator", "code_interpreter"]

[[benchmarks]]
name = "lifelong-agent"
backend = "friday-agent"
agent = "monitor_operative"
max_samples = 50
subset = "knowledge_graph"
tools = ["think", "calculator", "code_interpreter"]
